name: Build and Release Xcode Binary

on:
  push:
    tags:
      - 'v*' # Triggers when pushing tags like v1.0.0

permissions:
  contents: write # Required to create releases and upload assets

env:
  PROJECT_NAME: TuringEnigma.xcodeproj
  SCHEME: TuringEnigma
  APP_NAME: Turing Enigma
  CONFIGURATION: Release

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen and regenerate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath build/DerivedDataRelease \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app binary and source archive
        run: |
          set -x  # Enable debug output
          
          # Check if app exists
          APP_PATH="build/DerivedDataRelease/Build/Products/$CONFIGURATION/$APP_NAME.app"
          echo "Looking for app at: $APP_PATH"
          ls -la "build/DerivedDataRelease/Build/Products/$CONFIGURATION/" || true
          
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at: $APP_PATH"
            exit 1
          fi
          
          echo "App found successfully"
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Sanitize app name for filenames (replace spaces with hyphens)
          ARCHIVE_NAME="${APP_NAME// /-}"
          echo "Creating archives with name: ${ARCHIVE_NAME}-${VERSION}"

          # 1. Zip the compiled .app bundle
          ditto -c -k --keepParent "$APP_PATH" "${ARCHIVE_NAME}-${VERSION}-macos.zip"
          echo "Created: ${ARCHIVE_NAME}-${VERSION}-macos.zip"

          # 2. Create a clean source code .tar.gz from Git HEAD
          git archive --format=tar.gz --prefix="${ARCHIVE_NAME}-${VERSION}/" -o "${ARCHIVE_NAME}-${VERSION}-source.tar.gz" HEAD
          echo "Created: ${ARCHIVE_NAME}-${VERSION}-source.tar.gz"
          
          # Verify files were created
          ls -lh "${ARCHIVE_NAME}-${VERSION}-macos.zip" "${ARCHIVE_NAME}-${VERSION}-source.tar.gz"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Turing-Enigma-*-macos.zip
            Turing-Enigma-*-source.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
