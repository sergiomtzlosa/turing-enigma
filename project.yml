name: TuringEnigma
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TuringEnigmaCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.turingenigma.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  TuringEnigma:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - Info.plist
    resources:
      - path: Sources/App/Resources
    dependencies:
      - target: TuringEnigmaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.turingenigma
        PRODUCT_NAME: Turing Enigma
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TuringEnigmaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CoreTests
    dependencies:
      - target: TuringEnigmaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.turingenigma.coretests
        GENERATE_INFOPLIST_FILE: YES

  TuringEnigmaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: TuringEnigma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.turingenigma.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TuringEnigma:
    build:
      targets:
        TuringEnigma: all
        TuringEnigmaCoreTests: [test]
        TuringEnigmaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TuringEnigmaCoreTests
        - TuringEnigmaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
